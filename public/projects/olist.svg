<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOlist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b232c" />
      <stop offset="50%" stop-color="#283442" />
      <stop offset="100%" stop-color="#141a22" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgOlist)" />

  <!-- Grid mesh -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <circle cx="600" cy="375" r="150" fill="none" />
    <circle cx="600" cy="375" r="280" fill="none" />
    <circle cx="600" cy="375" r="400" fill="none" stroke-dasharray="8 8" />
  </g>

  <!-- Header -->
  <rect x="90" y="80" width="380" height="44" rx="22" fill="#c77b5a" fill-opacity="0.25" stroke="#c77b5a" stroke-width="1.5"/>
  <text x="115" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f7f4ec" letter-spacing="2">OLIST E-COMMERCE INTELLIGENCE</text>

  <!-- Supply Chain Nodes -->
  <line x1="250" y1="450" x2="450" y2="280" stroke="#87957a" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="450" y1="280" x2="750" y2="280" stroke="#c77b5a" stroke-width="4"/>
  <line x1="750" y1="280" x2="950" y2="480" stroke="#87957a" stroke-width="3"/>

  <!-- Bar Graphs -->
  <rect x="250" y="480" width="40" height="120" rx="8" fill="#87957a" fill-opacity="0.8"/>
  <rect x="310" y="420" width="40" height="180" rx="8" fill="#c77b5a" fill-opacity="0.9"/>
  <rect x="370" y="360" width="40" height="240" rx="8" fill="#e6b89c" fill-opacity="0.8"/>

  <rect x="790" y="380" width="40" height="220" rx="8" fill="#87957a" fill-opacity="0.8"/>
  <rect x="850" y="440" width="40" height="160" rx="8" fill="#c77b5a" fill-opacity="0.9"/>
  <rect x="910" y="320" width="40" height="280" rx="8" fill="#f7f4ec" fill-opacity="0.9"/>

  <!-- Nodes -->
  <circle cx="250" cy="450" r="14" fill="#87957a" />
  <circle cx="450" cy="280" r="18" fill="#c77b5a" stroke="#ffffff" stroke-width="3" />
  <circle cx="750" cy="280" r="18" fill="#f7f4ec" stroke="#c77b5a" stroke-width="4" />
  <circle cx="950" cy="480" r="14" fill="#87957a" />

  <!-- Floating Stats -->
  <rect x="470" y="180" width="260" height="100" rx="16" fill="#141a22" fill-opacity="0.9" stroke="#c77b5a" stroke-width="1.5" />
  <text x="495" y="215" font-family="sans-serif" font-size="12" fill="#77746d" letter-spacing="1">TOTAL ORDERS ANALYZED</text>
  <text x="495" y="255" font-family="serif" font-size="34" font-weight="bold" fill="#fcfaf5">100,000+</text>
</svg>
