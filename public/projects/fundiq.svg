<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18231c" />
      <stop offset="50%" stop-color="#243328" />
      <stop offset="100%" stop-color="#121a15" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#87957a" />
      <stop offset="50%" stop-color="#c77b5a" />
      <stop offset="100%" stop-color="#e6b89c" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c77b5a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c77b5a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="150" x2="1100" y2="150" />
    <line x1="100" y1="275" x2="1100" y2="275" />
    <line x1="100" y1="400" x2="1100" y2="400" />
    <line x1="100" y1="525" x2="1100" y2="525" />

    <line x1="200" y1="100" x2="200" y2="600" />
    <line x1="400" y1="100" x2="400" y2="600" />
    <line x1="600" y1="100" x2="600" y2="600" />
    <line x1="800" y1="100" x2="800" y2="600" />
    <line x1="1000" y1="100" x2="1000" y2="600" />
  </g>

  <!-- Chart Title Header Pill -->
  <rect x="100" y="80" width="320" height="44" rx="22" fill="#87957a" fill-opacity="0.2" stroke="#87957a" stroke-width="1.5"/>
  <text x="125" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f7f4ec" letter-spacing="2">FUNDIQ — MUTUAL FUND ANALYTICS</text>

  <!-- Area Fill -->
  <path d="M 100 525 Q 300 450, 450 320 T 750 250 T 1100 140 L 1100 525 Z" fill="url(#areaGrad)" />

  <!-- Trendline -->
  <path d="M 100 525 Q 300 450, 450 320 T 750 250 T 1100 140" fill="none" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Data Nodes -->
  <circle cx="450" cy="320" r="10" fill="#fcfaf5" stroke="#c77b5a" stroke-width="4" />
  <circle cx="750" cy="250" r="10" fill="#fcfaf5" stroke="#87957a" stroke-width="4" />
  <circle cx="1100" cy="140" r="12" fill="#c77b5a" stroke="#fcfaf5" stroke-width="4" />

  <!-- Floating Stats Card 1 -->
  <rect x="720" y="320" width="260" height="110" rx="16" fill="#24231f" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <text x="745" y="355" font-family="serif" font-size="14" fill="#77746d" letter-spacing="1">NAV CAGR GROWTH</text>
  <text x="745" y="400" font-family="serif" font-size="36" font-weight="bold" fill="#87957a">+24.8%</text>

  <!-- Floating Stats Card 2 -->
  <rect x="180" y="240" width="220" height="100" rx="16" fill="#24231f" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <text x="205" y="275" font-family="serif" font-size="13" fill="#77746d" letter-spacing="1">FUNDS ANALYZED</text>
  <text x="205" y="315" font-family="serif" font-size="32" font-weight="bold" fill="#f7f4ec">500+ Schemes</text>
</svg>
