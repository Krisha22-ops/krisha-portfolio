<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWiki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242120" />
      <stop offset="50%" stop-color="#36302e" />
      <stop offset="100%" stop-color="#171514" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgWiki)" />

  <!-- Header -->
  <rect x="90" y="80" width="400" height="44" rx="22" fill="#c77b5a" fill-opacity="0.25" stroke="#c77b5a" stroke-width="1.5"/>
  <text x="115" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f7f4ec" letter-spacing="2">WIKIPEDIA EDIT WARS ANALYTICS</text>

  <!-- Collision / Dispute Pulses -->
  <g fill="none" stroke="#c77b5a" stroke-width="2">
    <path d="M 150 480 L 300 480 L 350 250 L 400 550 L 450 180 L 500 500 L 600 480 L 700 480 L 750 200 L 800 580 L 850 150 L 900 520 L 1050 480" stroke="#c77b5a" stroke-width="5"/>
  </g>

  <!-- Baseline -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Conflict Spikes -->
  <circle cx="450" cy="180" r="14" fill="#c77b5a" stroke="#ffffff" stroke-width="3" />
  <circle cx="850" cy="150" r="16" fill="#c77b5a" stroke="#ffffff" stroke-width="4" />

  <!-- Stats Box -->
  <rect x="150" y="200" width="240" height="95" rx="16" fill="#171514" fill-opacity="0.9" stroke="#c77b5a" stroke-width="1.5" />
  <text x="175" y="235" font-family="sans-serif" font-size="12" fill="#77746d" letter-spacing="1">REVISIONS PARSED</text>
  <text x="175" y="275" font-family="serif" font-size="32" font-weight="bold" fill="#f7f4ec">2.5 Million</text>
</svg>
